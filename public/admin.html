<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin • ScrapeHub Pribadi</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>*{font-family:'Inter',sans-serif}.mono{font-family:'JetBrains Mono',monospace}.display{font-family:'Space Grotesk',sans-serif}.glass{background:rgba(255,255,255,0.85);backdrop-filter:blur(12px)}.fade-in{animation:fadeIn 0.5s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.scrollbar-hide{scrollbar-width:none;-ms-overflow-style:none}.scrollbar-hide::-webkit-scrollbar{display:none}</style>
</head>
<body class="bg-[#fbfbfb] text-zinc-900 antialiased">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;
function App(){
  const [stats,setStats]=useState(null);
  const [loading,setLoading]=useState(true);
  async function load(){ setLoading(true); try{ const r=await fetch('/api/analytics'); const j=await r.json(); setStats(j); }catch(e){} setLoading(false); }
  useEffect(()=>{ load(); const id=setInterval(load,3000); return ()=>clearInterval(id); },[]);
  async function reset(){ if(!confirm('Reset analytics real?')) return; await fetch('/api/analytics/reset?token=admin'); load(); }
  if(loading && !stats) return <div className="p-10 text-sm">Loading analytics real...</div>;
  return (
    <div className="min-h-screen">
      <header className="sticky top-0 z-30 border-b glass">
        <div className="max-w-[1300px] mx-auto px-4 md:px-6 py-3 flex justify-between items-center">
          <div className="flex gap-2 items-center"><div className="w-8 h-8 bg-black text-white rounded-xl flex items-center justify-center font-bold display">S</div><div><div className="font-bold display text-[14px]">ScrapeHub Admin</div><div className="text-[10px] text-zinc-500">Pribadi • Realtime • Real No Fake</div></div></div>
          <div className="flex gap-1.5"><a href="/" className="text-[11px] px-3 py-1.5 bg-white border rounded-full hover:bg-zinc-50 transition">App</a><a href="/docs.html" className="text-[11px] px-3 py-1.5 bg-white border rounded-full hover:bg-zinc-50 transition">Docs</a><button onClick={load} className="text-[11px] px-3 py-1.5 bg-black text-white rounded-full">Refresh</button><button onClick={reset} className="text-[11px] px-3 py-1.5 bg-red-50 border border-red-200 text-red-700 rounded-full">Reset</button></div>
        </div>
      </header>
      <main className="max-w-[1300px] mx-auto px-4 md:px-6 py-4 md:py-6">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div className="bg-white border rounded-[20px] p-5 hover:shadow-[0_8px_30px_rgba(0,0,0,0.06)] transition fade-in"><div className="text-[11px] text-zinc-500 font-medium tracking-wide">TOTAL REQUESTS</div><div className="text-[28px] font-bold mt-2 display">{stats?.total_requests||0}</div><div className="text-[11px] text-green-600 mt-1 flex items-center gap-1"><span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>Real live</div></div>
          <div className="bg-white border rounded-[20px] p-5 hover:shadow-[0_8px_30px_rgba(0,0,0,0.06)] transition fade-in"><div className="text-[11px] text-zinc-500 font-medium">TOTAL CHECKS</div><div className="text-[28px] font-bold mt-2 display">{stats?.total_checks||0}</div><div className="text-[11px] text-zinc-500 mt-1">Terminal checks</div></div>
          <div className="bg-white border rounded-[20px] p-5 hover:shadow-[0_8px_30px_rgba(0,0,0,0.06)] transition fade-in"><div className="text-[11px] text-zinc-500 font-medium">FORMATS USED</div><div className="text-[28px] font-bold mt-2 display">{stats?.total_formats_used||0}<span className="text-[16px] text-zinc-400">/30</span></div><div className="text-[11px] text-zinc-500 mt-1">Out of 30</div></div>
          <div className="bg-white border rounded-[20px] p-5 hover:shadow-[0_8px_30px_rgba(0,0,0,0.06)] transition fade-in"><div className="text-[11px] text-zinc-500 font-medium">UPTIME</div><div className="text-[18px] font-bold mt-2 display">{stats?.uptime||'-'}</div><div className="text-[10px] text-zinc-400 mt-1">Since {stats?.start_time?.slice(0,19)}</div></div>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4 md:mt-6">
          <div className="bg-white border rounded-[20px] p-5 hover:shadow-[0_8px_30px_rgba(0,0,0,0.04)] transition">
            <div className="text-[13px] font-semibold display">📊 Top Formats Real</div>
            <div className="mt-4 space-y-2.5">
              {(stats?.top_formats||[]).map(([fmt,count])=>(
                <div key={fmt} className="flex items-center gap-3 group">
                  <div className="w-20 text-[11px] mono capitalize font-medium">{fmt}</div>
                  <div className="flex-1 h-2.5 bg-zinc-100 rounded-full overflow-hidden"><div className="h-2.5 bg-black rounded-full transition-all duration-700 group-hover:bg-zinc-800" style={{width:`${Math.min(100,(count/(stats?.total_requests||1))*100*4)}%`}}></div></div>
                  <div className="w-8 text-[11px] font-bold">{count}</div>
                </div>
              ))}
              {(!stats?.top_formats||stats.top_formats.length===0)&&<div className="text-[12px] text-zinc-500 py-8 text-center">Belum ada request — scrape dulu di App<br/><span className="text-[11px] text-zinc-400">Contoh: https://quotes.toscrape.com</span></div>}
            </div>
          </div>
          <div className="bg-white border rounded-[20px] p-5 hover:shadow-[0_8px_30px_rgba(0,0,0,0.04)] transition">
            <div className="text-[13px] font-semibold display">🌐 Top Domains Real</div>
            <div className="mt-4 space-y-2.5">
              {(stats?.top_domains||[]).map(([dom,count])=>(
                <div key={dom} className="flex items-center gap-3 group">
                  <div className="w-28 md:w-32 text-[11px] mono truncate font-medium">{dom}</div>
                  <div className="flex-1 h-2.5 bg-zinc-100 rounded-full overflow-hidden"><div className="h-2.5 bg-zinc-800 rounded-full transition-all duration-700" style={{width:`${Math.min(100,(count/(stats?.total_requests||1))*100*4)}%`}}></div></div>
                  <div className="w-8 text-[11px] font-bold">{count}</div>
                </div>
              ))}
              {(!stats?.top_domains||stats.top_domains.length===0)&&<div className="text-[12px] text-zinc-500 py-8 text-center">Belum ada domain</div>}
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 mt-4 md:mt-6">
          <div className="bg-white border rounded-[20px] overflow-hidden hover:shadow-[0_8px_30px_rgba(0,0,0,0.04)] transition">
            <div className="px-5 py-3.5 border-b bg-zinc-50/80 flex justify-between items-center"><div className="text-[12px] font-semibold display">🕒 Recent Requests Live</div><div className="text-[10px] px-2 py-1 bg-green-50 text-green-700 border border-green-200 rounded-full animate-pulse">realtime 3s</div></div>
            <div className="max-h-[380px] overflow-auto scrollbar-hide">
              {(stats?.recent||[]).map((r,i)=>(
                <div key={i} className="px-5 py-3 border-b last:border-0 flex justify-between items-center hover:bg-zinc-50 transition">
                  <div className="min-w-0"><div className="text-[12px] font-medium truncate max-w-[160px] md:max-w-[200px]">{r.title||r.domain}</div><div className="text-[10px] mono text-zinc-500 truncate max-w-[180px] md:max-w-[220px]">{r.url}</div></div>
                  <div className="text-right ml-3"><div className="text-[10px] px-2.5 py-1 bg-black text-white rounded-full capitalize">{r.format}</div><div className="text-[10px] text-zinc-400 mt-1">{new Date(r.time).toLocaleTimeString()}</div></div>
                </div>
              ))}
              {(!stats?.recent||stats.recent.length===0)&&<div className="p-8 text-center text-[12px] text-zinc-500">Belum ada — buka App dan scrape</div>}
            </div>
          </div>
          <div className="bg-white border rounded-[20px] overflow-hidden hover:shadow-[0_8px_30px_rgba(0,0,0,0.04)] transition">
            <div className="px-5 py-3.5 border-b bg-zinc-50/80"><div className="text-[12px] font-semibold display">📟 Terminal Checks Log Real</div></div>
            <div className="max-h-[380px] overflow-auto mono text-[11px] scrollbar-hide">
              {(stats?.checks_log||[]).map((c,i)=>(
                <div key={i} className="px-5 py-2.5 border-b last:border-0 flex justify-between items-center hover:bg-zinc-50 transition">
                  <span className="truncate max-w-[150px] md:max-w-[180px]">{c.url}</span>
                  <span className={`px-2 py-1 rounded-full text-[10px] font-medium ${c.is_active?'bg-green-50 text-green-700 border border-green-200':'bg-red-50 text-red-700 border border-red-200'}`}>{c.is_active?'✅ ACTIVE':'❌ INACTIVE'} {c.total_time_ms}ms</span>
                </div>
              ))}
              {(!stats?.checks_log||stats.checks_log.length===0)&&<div className="p-8 text-center text-[12px] text-zinc-500">Belum ada check — klik Terminal Check di App</div>}
            </div>
          </div>
        </div>

        <div className="mt-6 bg-white border rounded-[20px] overflow-hidden">
          <div className="px-5 py-3 border-b bg-zinc-50/80 text-[12px] font-semibold display">🔧 Raw Analytics JSON Real</div>
          <pre className="mono text-[11px] p-5 overflow-auto max-h-[300px] bg-[#fcfcfc] scrollbar-hide">{JSON.stringify(stats,null,2)}</pre>
        </div>

        <div className="mt-8 text-center pb-8">
          <div className="inline-flex px-4 py-2 bg-white border rounded-full text-[11px] text-zinc-500">🔒 Pribadi Edition • Analytics Real • Responsive HP & Laptop • Smooth</div>
        </div>
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
